name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run setup:binaries
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- dist
      - if: runner.os == 'Linux'
        run: node dist/cli.js run examples/product-demo.json --out /tmp/video-forge-demo
      - if: runner.os == 'Linux'
        run: node dist/cli.js run examples/reel-smoke.json --out /tmp/video-forge-reel-smoke
      - if: runner.os == 'Linux'
        run: node dist/cli.js run examples/pop-smoke.json --out /tmp/video-forge-pop-smoke
      - if: runner.os == 'Linux'
        run: node dist/cli.js run examples/overlay-smoke.json --out /tmp/video-forge-overlay-smoke
      - if: runner.os == 'Linux'
        run: node dist/cli.js run examples/world-smoke.json --out /tmp/video-forge-world-smoke
      - if: runner.os == 'Linux'
        run: node dist/cli.js run examples/code-smoke/project.json --out /tmp/video-forge-code-smoke
      - if: runner.os == 'Linux'
        run: node scripts/check-zero-refraction.mjs
      - run: python3 scripts/package.py --out release-assets
      - run: python3 scripts/validate-archives.py release-assets
      - run: python3 scripts/prepare-release.py --out release-assets
      - run: python3 scripts/verify-release.py release-assets
