name: check
on: [push, pull_request]
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run setup:binaries
      - run: npm run check
      - run: npm run build
      - if: runner.os == 'Linux'
        run: node dist/cli.js run examples/product-demo.json --out /tmp/video-forge-demo
      - if: runner.os == 'Linux'
        run: node dist/cli.js run examples/reel-smoke.json --out /tmp/video-forge-reel-smoke
      - run: python3 scripts/package.py --out release-assets
      - run: python3 scripts/validate-archives.py release-assets
